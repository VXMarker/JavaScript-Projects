<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <script
      src="https://kit.fontawesome.com/b4254b9b2a.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../index.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header class="head">
      <h1>Game</h1>
    </header>
    <main class="main">
      <p class="text-option">Select one option</p>
      <ul class="options-container">
        <li>
          <button class="choice-btn gem">
            <i class="fa-solid fa-gem"></i>
          </button>
        </li>
        <li>
          <button class="choice-btn paper">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </li>
        <li>
          <button class="choice-btn scissors">
            <i class="fa-solid fa-scissors"></i>
          </button>
        </li>
      </ul>
      <p class="text-option">Esperando Respuesta</p>
      <ul class="result-container">
        <li class="player-display display">
          <span class="hidden player-icon gem">
            <i class="fa-solid fa-gem"></i>
          </span>
          <span class="hidden player-icon paper">
            <i class="fa-solid fa-paper-plane"></i>
          </span>
          <span class="hidden player-icon scissors">
            <i class="fa-solid fa-scissors"></i>
          </span>
        </li>
        <li class="computer-display display">
          <span class="hidden computer-icon gem">
            <i class="fa-solid fa-gem"></i>
          </span>
          <span class="hidden computer-icon paper">
            <i class="fa-solid fa-paper-plane"></i>
          </span>
          <span class="hidden computer-icon scissors">
            <i class="fa-solid fa-scissors"></i>
          </span>
        </li>
        <li class="result-display display">
          <span class="hidden check simbol">
            <i class="fa-solid fa-check"></i>
          </span>
          <span class="hidden xmark simbol">
            <i class="fa-solid fa-xmark"></i>
          </span>
          <span class="hidden minus simbol">
            <i class="fa-solid fa-minus"></i>
          </span>
        </li>
      </ul>
    </main>
    <script src="main.js"></script>
  </body>
</html>
